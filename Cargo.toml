[package]
name = "agente-ollama"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
regex = "1.10"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
colored = "2.1"
dirs = "5.0"
ratatui = "0.26"
crossterm = "0.27"
unicode-width = "0.1"

[[bin]]
name = "agente"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
